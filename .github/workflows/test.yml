name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-
      - name: Run tests
        run: clojure -M:test
      - name: Lint (clj-kondo)
        run: clojure -M:lint
      - name: Compile bounded party-tally profile
        run: |
          mkdir -p target/kotoba
          clojure -M:kotoba compile test/ghosthacker_vamos/bounded_conformance.kotoba \
            --source-path src --target js-browser --output target/kotoba/vamos.mjs
          clojure -M:kotoba compile test/ghosthacker_vamos/bounded_conformance.kotoba \
            --source-path src --target wasm32-browser --output target/kotoba/vamos.wasm
      - name: Execute Web and typed Wasm conformance
        run: |
          compiler_src="$(clojure -Spath -M:kotoba | tr ':' '\n' | grep '/compiler/' | head -1)"
          node scripts/verify-kotoba.mjs target/kotoba/vamos.mjs \
            target/kotoba/vamos.wasm "$(dirname "$compiler_src")/runtime/browser-host.mjs"
